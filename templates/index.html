<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字命理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F3EE;
            --bg-card: #FDFCFA;
            --bg-input: #FAFAF8;
            --text: #2C2C2C;
            --text-light: #6B6B6B;
            --text-muted: #9B9B9B;
            --border: #E0DDD5;
            --bamboo: #6B8E5A;
            --bamboo-light: #8FB573;
            --bamboo-pale: #E8F0E3;
            --wood: #8B7355;
            --wood-light: #A89070;
            --wood-pale: #EDE5D8;
            --ink: #3D3D3D;
            --vermilion: #C45C48;
            --gold: #B8943F;
            --paper: #FAF8F5;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
            --radius: 6px;
            --radius-lg: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── 背景纹理 ── */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(107,142,90,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(139,115,85,0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
        }

        /* ── 标题区 ── */
        header {
            text-align: center;
            margin-bottom: 52px;
        }

        .site-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .site-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            font-weight: 300;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider-line {
            width: 40px;
            height: 1px;
            background: var(--border);
        }

        .divider-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--bamboo);
        }

        /* ── 输入卡片 ── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .card-label {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.08em;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-light);
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--text);
            background: var(--bg-input);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--bamboo);
            box-shadow: 0 0 0 3px var(--bamboo-pale);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-primary {
            background: var(--bamboo);
            color: white;
            border: none;
            padding: 13px 40px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Serif SC', serif;
            display: block;
            margin: 28px auto 0;
        }

        .btn-primary:hover {
            background: var(--bamboo-light);
            box-shadow: 0 4px 16px rgba(107,142,90,0.3);
            transform: translateY(-1px);
        }

        /* ── 四柱展示 ── */
        .bazi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .bazi-pillar {
            text-align: center;
            padding: 18px 8px;
            background: var(--paper);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .bazi-pillar-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .bazi-gan {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .bazi-zhi {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--wood);
            margin-bottom: 6px;
        }

        .bazi-wx {
            display: inline-block;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 400;
        }

        .wx-木 { background: #E8F0E3; color: #4A7040; }
        .wx-火 { background: #FBEPE8; color: #A04030; }
        .wx-土 { background: #EDE5D8; color: #6B5030; }
        .wx-金 { background: #EDE9E3; color: #605040; }
        .wx-水 { background: #E3EEF4; color: #3D6070; }

        /* ── 命理信息 ── */
        .info-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-cell {
            padding: 14px;
            background: var(--paper);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-align: center;
        }

        .info-cell-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .info-cell-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            font-family: 'Noto Serif SC', serif;
        }

        .info-cell-value.gold { color: var(--gold); }
        .info-cell-value.bamboo { color: var(--bamboo); }

        /* ── 五行分布 ── */
        .wx-bar-wrap {
            margin-bottom: 12px;
        }

        .wx-bar {
            display: flex;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            background: var(--border);
        }

        .wx-bar-segment {
            height: 100%;
            transition: width 0.6s ease;
        }

        .wx-bar 木 { background: #7BA05B; }
        .wx-bar 火 { background: #D4644A; }
        .wx-bar 土 { background: #B8956A; }
        .wx-bar 金 { background: #8B7355; }
        .wx-bar 水 { background: #5B8BA0; }

        .wx-legend {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .wx-legend-item {
            font-size: 12px;
            color: var(--text-light);
        }

        .wx-legend-item span {
            font-weight: 600;
            margin-left: 2px;
        }

        /* ── 用神忌神 ── */
        .gods-row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .gods-box {
            flex: 1;
            padding: 16px;
            border-radius: var(--radius);
        }

        .gods-box.good {
            background: var(--bamboo-pale);
            border: 1px solid rgba(107,142,90,0.2);
        }

        .gods-box.bad {
            background: #F5EAE3;
            border: 1px solid rgba(180,100,80,0.2);
        }

        .gods-title {
            font-size: 12px;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .goods-box .gods-title { color: var(--bamboo); }
        .bad-box .gods-title { color: var(--vermilion); }

        .gods-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .god-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .goods-box .god-tag {
            background: white;
            color: var(--bamboo);
        }

        .bad-box .god-tag {
            background: white;
            color: var(--vermilion);
        }

        /* ── 解读文字 ── */
        .section-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.08em;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .analysis-text {
            font-size: 14px;
            line-height: 2;
            color: var(--text-light);
            padding: 16px;
            background: var(--paper);
            border-radius: var(--radius);
            border-left: 3px solid var(--bamboo);
        }

        .analysis-highlight {
            background: linear-gradient(135deg, var(--bamboo) 0%, var(--wood) 100%);
            color: white;
            padding: 16px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 2;
            margin-bottom: 4px;
        }

        .strength-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            margin-right: 6px;
        }

        /* ── 十神 ── */
        .ten-god-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .ten-god-cell {
            text-align: center;
            padding: 12px 6px;
            background: var(--paper);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .ten-god-pillar {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .ten-god-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--bamboo);
            font-family: 'Noto Serif SC', serif;
        }

        .ten-god-trait {
            font-size: 10px;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* ── 大运时间线 ── */
        .dayun-list {
            position: relative;
        }

        .dayun-item {
            display: flex;
            align-items: stretch;
            margin-bottom: 0;
        }

        .dayun-age {
            width: 72px;
            flex-shrink: 0;
            text-align: right;
            padding-right: 14px;
            padding-top: 4px;
        }

        .dayun-age-num {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .dayun-age-xu {
            font-size: 11px;
            color: var(--text-muted);
        }

        .dayun-axis {
            width: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .dayun-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            border: 2px solid var(--bg-card);
            flex-shrink: 0;
            margin-top: 6px;
            z-index: 1;
        }

        .dayun-dot.active {
            background: var(--bamboo);
            box-shadow: 0 0 0 3px rgba(107,142,90,0.2);
        }

        .dayun-line {
            width: 1px;
            flex: 1;
            background: var(--border);
            min-height: 20px;
        }

        .dayun-content {
            flex: 1;
            padding: 8px 14px;
            margin-bottom: 10px;
            background: var(--paper);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .dayun-content.current {
            background: linear-gradient(135deg, rgba(107,142,90,0.08), rgba(139,115,85,0.06));
            border-color: rgba(107,142,90,0.3);
        }

        .dayun-gz {
            font-family: 'Noto Serif SC', serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .dayun-wx {
            font-size: 11px;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .dayun-range {
            font-size: 11px;
            color: var(--text-muted);
        }

        .dayun-desc {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
            line-height: 1.7;
        }

        /* ── 流年 ── */
        .liunian-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .liunian-cell {
            text-align: center;
            padding: 12px 4px;
            background: var(--paper);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .liunian-year {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .liunian-gz {
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--wood);
            margin: 4px 0;
        }

        .liunian-age {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* ── 优劣势 ── */
        .sw-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .sw-box {
            padding: 16px;
            border-radius: var(--radius);
        }

        .sw-box.positive {
            background: var(--bamboo-pale);
            border-left: 3px solid var(--bamboo);
        }

        .sw-box.negative {
            background: #F5EAE3;
            border-left: 3px solid var(--vermilion);
        }

        .sw-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .positive .sw-title { color: var(--bamboo); }
        .negative .sw-title { color: var(--vermilion); }

        .sw-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .sw-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .positive .sw-tag {
            background: white;
            color: var(--bamboo);
        }

        .negative .sw-tag {
            background: white;
            color: var(--vermilion);
        }

        /* ── 健康 ── */
        .health-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .health-cell {
            padding: 14px;
            background: var(--paper);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-align: center;
        }

        .health-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .health-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--bamboo);
        }

        /* ── 结果页 ── */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .result-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .result-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-reset {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: var(--radius);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-reset:hover {
            background: var(--paper);
            border-color: var(--text-muted);
        }

        /* ── 错误 / 加载 ── */
        .error-msg {
            display: none;
            background: #FDF0EE;
            border: 1px solid #F0C8C0;
            color: var(--vermilion);
            padding: 14px 18px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 14px;
        }

        .error-msg.show { display: block; }

        .loading {
            display: none;
            text-align: center;
            padding: 48px;
        }

        .loading.show { display: block; }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-top-color: var(--bamboo);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ── 响应式 ── */
        @media (max-width: 640px) {
            .container { padding: 24px 12px; }
            .card { padding: 20px 16px; }
            .form-grid { grid-template-columns: 1fr; gap: 12px; }
            .bazi-grid { grid-template-columns: repeat(2, 1fr); }
            .info-row { grid-template-columns: repeat(2, 1fr); }
            .ten-god-grid { grid-template-columns: repeat(2, 1fr); }
            .liunian-grid { grid-template-columns: repeat(3, 1fr); }
            .gods-row { flex-direction: column; }
            .sw-grid { grid-template-columns: 1fr; }
            .dayun-age { width: 56px; }
            .form-row {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .btn-primary { width: 100%; }
        }

        /* ── 隐藏逻辑 ── */
        .result-section { display: none; }
        .result-section.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="site-title">八字命理</div>
            <div class="site-subtitle">生辰 · 四柱 · 命局</div>
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-dot"></div>
                <div class="divider-line"></div>
            </div>
        </header>

        <!-- 输入表单 -->
        <div id="inputForm">
            <div class="card">
                <div class="card-label">出生信息</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="name" placeholder="你的名字" value="">
                    </div>
                    <div class="form-group">
                        <label>性别</label>
                        <select id="gender">
                            <option value="女">女</option>
                            <option value="男">男</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>出生年份</label>
                        <input type="number" id="year" placeholder="1991" min="1900" max="2025">
                    </div>
                    <div class="form-group">
                        <label>出生月份</label>
                        <input type="number" id="month" placeholder="1-12" min="1" max="12">
                    </div>
                    <div class="form-group">
                        <label>出生日期</label>
                        <input type="number" id="day" placeholder="1-31" min="1" max="31">
                    </div>
                    <div class="form-group">
                        <label>出生时辰（小时）</label>
                        <input type="number" id="hour" placeholder="0-23" min="0" max="23">
                    </div>
                </div>
                <div class="form-row" style="margin-top:16px; grid-template-columns: 1fr 1fr 1fr;">
                    <div class="form-group">
                        <label>分钟</label>
                        <input type="number" id="minute" placeholder="0-59" min="0" max="59" value="0">
                    </div>
                    <div class="form-group">
                        <label>出生省份</label>
                        <select id="province" onchange="updateCities()">
                            <option value="">请选择省份</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>出生城市</label>
                        <select id="city">
                            <option value="">请先选择省份</option>
                        </select>
                    </div>
                </div>
                <button class="btn-primary" onclick="calculate()">开 始 排 盘</button>
            </div>
        </div>

        <!-- 错误 -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- 加载 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在解析命盘...</p>
        </div>

        <!-- 结果 -->
        <div class="result-section" id="resultSection">

            <!-- 头部 -->
            <div class="result-header">
                <div>
                    <div class="result-name" id="resultName">—</div>
                    <div class="result-meta" id="resultMeta">— · —</div>
                </div>
                <button class="btn-reset" onclick="resetForm()">重新测算</button>
            </div>

            <!-- 四柱 -->
            <div class="card">
                <div class="card-label">四柱八字</div>
                <div class="bazi-grid" id="baziGrid"></div>
            </div>

            <!-- 五行 -->
            <div class="card">
                <div class="card-label">五行分布</div>
                <div class="wx-bar-wrap">
                    <div class="wx-bar" id="wxBar"></div>
                </div>
                <div class="wx-legend" id="wxLegend"></div>
            </div>

            <!-- 命局 -->
            <div class="card">
                <div class="card-label">命局概况</div>
                <div class="info-row" id="infoRow"></div>

    <script>
        const WX_MAP = {
            "甲": "木", "乙": "木", "丙": "火", "丁": "火",
            "戊": "土", "己": "土", "庚": "金", "辛": "金",
            "壬": "水", "癸": "水",
            "子": "水", "丑": "土", "寅": "木", "卯": "木",
            "辰": "土", "巳": "火", "午": "火", "未": "土",
            "申": "金", "酉": "金", "戌": "土", "亥": "水"
        };
        const WX_CN = ["木", "火", "土", "金", "水"];
        const WX_KEY = { "木": "wood", "火": "fire", "土": "earth", "金": "metal", "水": "water" };

        function getWx(char) { return WX_MAP[char] || "土"; }

        function calculate() {
            var d = document;
            var name = d.getElementById("name").value || "访客";
            var gender = d.getElementById("gender").value;
            var year = d.getElementById("year").value;
            var month = d.getElementById("month").value;
            var day = d.getElementById("day").value;
            var hour = d.getElementById("hour").value;
            var minute = d.getElementById("minute").value || "0";
            var city = d.getElementById("city").value.replace("市", "");
            if (!city) { showError("请选择出生城市"); return; }
            if (!year || !month || !day || hour === "") { showError("请填写完整的出生信息"); return; }
            hideError();
            showLoading(true);
            fetch("/api/bazi", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, gender, year, month, day, hour, minute, city })
            })
            .then(r => r.json())
            .then(data => {
                showLoading(false);
                if (data.error) { showError(data.error); return; }
                displayResult(data);
            })
            .catch(() => { showLoading(false); showError("网络错误，请稍后重试"); });
        }

        function displayResult(data) {
            var bazi = data.bazi_data.lunar;
            var ganzhi = bazi.gan_zhi;
            var dayGan = ganzhi.day.charAt(0);
            var WL = { wood: "木", fire: "火", earth: "土", metal: "金", water: "水" };
            var WX_SEQ = ["wood", "fire", "earth", "metal", "water"];

            // 姓名时间
            d("resultName").textContent = data.name;
            d("resultMeta").textContent =
                data.birth_info.year + "年" + data.birth_info.month + "月" + data.birth_info.day + "日 " +
                bazi.date.shichen + "时 · " + data.gender;

            // 四柱
            var pillars = [
                { label: "年柱", gz: ganzhi.year },
                { label: "月柱", gz: ganzhi.month },
                { label: "日柱", gz: ganzhi.day },
                { label: "时柱", gz: ganzhi.hour }
            ];
            var baziHtml = "";
            pillars.forEach(function(p) {
                var gan = p.gz.charAt(0), zhi = p.gz.charAt(1);
                var wx = getWx(gan);
                baziHtml += '<div class="bazi-pillar"><div class="bazi-pillar-label">' + p.label + '</div>' +
                    '<div class="bazi-gan">' + gan + '</div>' +
                    '<div class="bazi-zhi">' + zhi + '</div>' +
                    '<span class="bazi-wx wx-' + wx + '">' + wx + '</span></div>';
            });
            d("baziGrid").innerHTML = baziHtml;

            // 五
            // 五行统计
            var allChars = ganzhi.year + ganzhi.month + ganzhi.day + ganzhi.hour;
            var wxCount = { wood: 0, fire: 0, earth: 0, metal: 0, water: 0 };
            for (var i = 0; i < allChars.length; i++) {
                var wx = getWx(allChars.charAt(i));
                if (wxCount[WX_KEY[wx]] !== undefined) wxCount[WX_KEY[wx]]++;
            }
            var total = allChars.length;

            // 五行柱状条
            var barHtml = "";
            WX_SEQ.forEach(function(w) {
                var pct = Math.round(wxCount[w] / total * 100);
                if (pct > 0) barHtml += '<div class="wx-bar-segment ' + w + '" style="width:' + pct + '%"></div>';
            });
            d("wxBar").innerHTML = barHtml;

            var legendHtml = "";
            WX_SEQ.forEach(function(w) {
                legendHtml += '<div class="wx-legend-item">' + WL[w] + '<span>' + wxCount[w] + '</span></div>';
            });
            d("wxLegend").innerHTML = legendHtml;

            // 命局信息
            var dayun = data.bazi_data.dayun;
            var currentDayun = null;
            dayun.dayun_list.forEach(function(d) { if (d.gan_zhi !== "小运") currentDayun = d; });

            var infoHtml = '<div class="info-cell"><div class="info-cell-label">日主</div><div class="info-cell-value">' + dayGan + '木</div></div>';
            infoHtml += '<div class="info-cell"><div class="info-cell-label">起运</div><div class="info-cell-value">' + dayun.start_age_description + '</div></div>';
            infoHtml += '<div class="info-cell"><div class="info-cell-label">大运</div><div class="info-cell-value">' + dayun.direction + '</div></div>';
            infoHtml += '<div class="info-cell"><div class="info-cell-label">当前大运</div><div class="info-cell-value gold">' + (currentDayun ? currentDayun.gan_zhi : "—") + '</div></div>';
            d("infoRow").innerHTML = infoHtml;

            // 用神忌神（来自API）
            var use = data.analysis && data.analysis.use ? data.analysis.use : ["金"];
            var avoid = data.analysis && data.analysis.avoid ? data.analysis.avoid : ["木","水"];
            var useHtml = "", avoidHtml = "";
            use.forEach(function(u) { useHtml += '<span class="god-tag">' + u + '</span>'; });
            avoid.forEach(function(a) { avoidHtml += '<span class="god-tag">' + a + '</span>'; });
            d("godsGood").innerHTML = useHtml;
            d("godsBad").innerHTML = avoidHtml;

            // 解读
            var analysis = data.analysis || {};
            var strength = analysis.strength || {};
            d("analysisSummary").innerHTML = '<span class="strength-badge">' + (strength.level || "中和") + '</span>' + (analysis.summary || "");

            var charText = analysis.character || {};
            d("analysisCharacter").innerHTML = charText.nature_description || "";

            // 十神
            var tgNames = charText.ten_gods || {};
            var tgPillars = ["year", "month", "day", "hour"];
            var tgMap = { year: "年柱", month: "月柱", day: "日柱", hour: "时柱" };
            var tgHtml = "";
            tgPillars.forEach(function(p) {
                var god = tgNames[p] || "其他";
                tgHtml += '<div class="ten-god-cell"><div class="ten-god-pillar">' + tgMap[p] + '</div><div class="ten-god-name">' + god + '</div></div>';
            });
            d("tenGodGrid").innerHTML = tgHtml;

            // 十神详情
            var tgDetails = charText.ten_god_details || {};
            var tgDetailsHtml = "";
            function cleanPunc(s) { return s.replace(/[，。、；：；.,;:\s]*$/, ""); }
            function joinList(arr) {
                return (arr || []).map(cleanPunc).filter(Boolean).join("、");
            }
            tgPillars.forEach(function(p) {
                var detail = tgDetails[p] || {};
                var pos = joinList(detail.positive);
                var neg = joinList(detail.negative);
                var rel = detail.relationship || "";
                var def = detail.definition || "";
                tgDetailsHtml += '<div style="margin-top:14px;padding:14px;background:var(--paper);border-radius:var(--radius);border-left:3px solid var(--bamboo)">' +
                    '<div style="font-size:13px;font-weight:700;color:var(--bamboo);margin-bottom:6px">' + tgMap[p] + ' · ' + (tgNames[p]||"其他") + '</div>' +
                    (def ? '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">' + def + '</div>' : '') +
                    (pos ? '<div style="font-size:12px;color:var(--text-light)">特点：' + pos + '</div>' : '') +
                    (neg ? '<div style="font-size:12px;color:var(--text-light);margin-top:4px">注意：' + neg + '</div>' : '') +
                    (rel ? '<div style="font-size:12px;color:var(--bamboo);margin-top:4px">感情：' + rel + '</div>' : '') +
                    '</div>';
            });
            d("tenGodDetails").innerHTML = tgDetailsHtml;

            // 优劣势
            var sw = charText.strengths_weaknesses || {};
            var posTags = (sw.strengths || []).map(function(s) { return '<span class="sw-tag">' + s + '</span>'; }).join("");
            var negTags = (sw.weaknesses || []).map(function(w) { return '<span class="sw-tag">' + w + '</span>'; }).join("");
            d("swGrid").innerHTML = '<div class="sw-box positive"><div class="sw-title">优势</div><div class="sw-tags">' + posTags + '</div></div>' +
                '<div class="sw-box negative"><div class="sw-title">劣势</div><div class="sw-tags">' + negTags + '</div></div>';

            // 情感社交事业
            d("emotionalSection").innerHTML = charText.emotional || "情感模式平稳。";
            d("socialSection").innerHTML = charText.social || "人际关系和谐。";
            var wuxingDetail = (analysis.wuxing || {}).detail || {};
            d("careerSection").innerHTML = wuxingDetail.career || "事业发展平稳。";

            // 健康
            var healthParts = wuxingDetail.health || [];
            if (healthParts.length > 0) {
                d("healthGrid").innerHTML = '<div class="health-cell"><div class="health-label">重点关注</div><div class="health-value">' + healthParts[0] + '</div></div>' +
                    '<div class="health-cell"><div class="health-label">次要注意</div><div class="health-value">' + (healthParts[1] || healthParts[0]) + '</div></div>';
            } else {
                d("healthGrid").innerHTML = '<div class="health-cell" style="grid-column:1/-1"><div class="health-label">总体</div><div class="health-value">健康平稳，注意良好生活习惯</div></div>';
            }

            // 大运时间线
            var nowYear = new Date().getFullYear();
            var dayunInterps = (analysis.dayun_interpretations || []).reduce(function(acc, item) {
                acc[item.ganzhi] = item; return acc;
            }, {});
            var nearby = dayun.dayun_list.filter(function(d) {
                if (d.gan_zhi === "小运") return false;
                var r = d.year_range || "";
                var parts = r.split("-");
                if (parts.length < 2) return false;
                return parseInt(parts[1]) >= nowYear - 10 && parseInt(parts[0]) <= nowYear + 10;
            });
            var timelineHtml = "";
            nearby.forEach(function(d, idx) {
                var gan = d.gan_zhi.charAt(0);
                var wx = getWx(gan);
                var isCurrent = d.year_range && d.year_range.indexOf(String(nowYear)) >= 0;
                var interp = dayunInterps[d.gan_zhi] || {};
                var desc = interp.description || "";
                timelineHtml += '<div class="dayun-item"><div class="dayun-age"><div class="dayun-age-num">' + d.age_range + '</div><div class="dayun-age-xu">' + d.age_range_xu + '</div></div>' +
                    '<div class="dayun-axis"><div class="dayun-dot' + (isCurrent ? ' active' : '') + '"></div>' + (idx < nearby.length - 1 ? '<div class="dayun-line"></div>' : '') + '</div>' +
                    '<div class="dayun-content' + (isCurrent ? ' current' : '') + '"><div class="dayun-gz">' + d.gan_zhi + '</div>' +
                    '<div class="dayun-wx">' + wx + '</div><div class="dayun-range">' + d.year_range + '</div>' +
                    (desc ? '<div class="dayun-desc">' + desc + '</div>' : '') + '</div></div>';
            });
            d("dayunList").innerHTML = timelineHtml;

            // 流年
            var liunianData = [];
            dayun.dayun_list.forEach(function(d) { if (d.liu_nian) liunianData = liunianData.concat(d.liu_nian); });
            liunianData = liunianData.filter(function(y) {
                var yr = parseInt(y.year);
                return yr >= nowYear - 2 && yr <= nowYear + 2;
            }).slice(0, 5);
            var liunianHtml = "";
            liunianData.forEach(function(y) {
                liunianHtml += '<div class="liunian-cell"><div class="liunian-year">' + y.year + '年</div><div class="liunian-gz">' + y.gan_zhi + '</div><div class="liunian-age">' + y.age_xu + '岁</div></div>';
            });
            d("liunianGrid").innerHTML = liunianHtml;

            d("inputForm").style.display = "none";
            d("resultSection").classList.add("show");
        }

        function resetForm() {
            d("resultSection").classList.remove("show");
            d("inputForm").style.display = "block";
            d("errorMsg").classList.remove("show");
        }

            var el = d("errorMsg");
            el.textContent = msg;
            el.classList.add("show");

        // 省市数据

        };

        function updateCities() {
            var prov = d("province").value;
            var citySel = d("city");
            citySel.innerHTML = '<option value="">请选择城市</option>';
            if (!prov || !PROVINCES[prov]) return;
            PROVINCES[prov].forEach(function(city) {
                var opt = document.createElement("option");
                opt.value = city; opt.textContent = city;
                citySel.appendChild(opt);
            });
        }

        function initProvinces() {
            var provSel = d("province");
            var sorted = Object.keys(PROVINCES).sort();
            sorted.forEach(function(prov) {
                var opt = document.createElement("option");
                opt.value = prov; opt.textContent = prov;
                provSel.appendChild(opt);
            });
            // 默认选湖北省
            provSel.value = "湖北省";
            updateCities();
            // 默认选武汉市
            setTimeout(function() { d("city").value = "武汉市"; }, 0);
        }

        window.addEventListener("DOMContentLoaded", initProvinces);
    </script>
</body>
</html>
