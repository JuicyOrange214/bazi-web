<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字排盘 - 命理分析</title>
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a68;
            --text-muted: #9090a8;
            --border: #e8e8f0;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-bg: #eef2ff;
            --gold: #d4a853;
            --gold-light: #f0dca0;
            --success: #10b981;
            --error: #ef4444;
            --wood: #3e753b;
            --fire: #d64036;
            --earth: #8c6450;
            --metal: #b08d28;
            --water: #3d6e85;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* 输入表单 */
        .form-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-title::before {
            content: "";
            width: 4px;
            height: 18px;
            background: var(--accent);
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* 结果展示 */
        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .result-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .result-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn-reset {
            background: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: var(--border);
        }

        /* 四柱展示 */
        .bazi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .bazi-column {
            text-align: center;
            padding: 16px 8px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
        }

        .bazi-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .bazi-ganzhi {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
        }

        .bazi-element {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .bazi-element .wu-xing {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 4px;
        }

        .wu-xing.wood { background: #e8f5e9; color: var(--wood); }
        .wu-xing.fire { background: #ffebee; color: var(--fire); }
        .wu-xing.earth { background: #efebe9; color: var(--earth); }
        .wu-xing.metal { background: #fff8e1; color: var(--metal); }
        .wu-xing.water { background: #e3f2fd; color: var(--water); }

        /* 命理信息 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .info-item {
            padding: 16px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .info-value.gold {
            color: var(--metal);
        }

        /* 喜忌神 */
        .gods-section {
            margin-top: 24px;
            padding: 20px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
        }

        .gods-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .gods-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .god-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .god-tag.good {
            background: #dcfce7;
            color: #166534;
        }

        .god-tag.bad {
            background: #fee2e2;
            color: #991b1b;
        }

        /* 流年 */
        .liunian-list {
            margin-top: 16px;
        }

        .liunian-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .liunian-item:last-child {
            border-bottom: none;
        }

        .liunian-year {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            width: 60px;
        }

        .liunian-gz {
            font-size: 14px;
            color: var(--text-secondary);
            font-family: "KaiTi", "STKaiti", "楷体", serif;
        }

        .liunian-age {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* 加载状态 */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 错误提示 */
        .error-msg {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-msg.show {
            display: block;
        }

        /* 大运 */
        .dayun-section {
            margin-top: 24px;
        }

        .dayun-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .dayun-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .dayun-item {
            padding: 12px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .dayun-age {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .dayun-gz {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            font-family: "KaiTi", "STKaiti", "楷体", serif;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .container {
                padding: 24px 16px;
            }
            
            .bazi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .form-card, .result-card {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>八字排盘</h1>
            <p class="subtitle">输入出生信息，获取命理分析</p>
        </header>

        <!-- 输入表单 -->
        <div class="form-card" id="inputForm">
            <div class="form-title">出生信息</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="name" placeholder="你的名字" value="">
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select id="gender">
                        <option value="女">女</option>
                        <option value="男">男</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出生年份</label>
                    <input type="number" id="year" placeholder="1991" min="1900" max="2025">
                </div>
                <div class="form-group">
                    <label>出生月份</label>
                    <input type="number" id="month" placeholder="1-12" min="1" max="12">
                </div>
                <div class="form-group">
                    <label>出生日期</label>
                    <input type="number" id="day" placeholder="1-31" min="1" max="31">
                </div>
                <div class="form-group">
                    <label>出生时辰（小时）</label>
                    <input type="number" id="hour" placeholder="0-23" min="0" max="23">
                </div>
                <div class="form-group">
                    <label>出生城市</label>
                    <select id="city">
                        <option value="武汉">武汉</option>
                        <option value="北京">北京</option>
                        <option value="上海">上海</option>
                        <option value="广州">广州</option>
                        <option value="深圳">深圳</option>
                        <option value="成都">成都</option>
                        <option value="杭州">杭州</option>
                        <option value="南京">南京</option>
                        <option value="西安">西安</option>
                        <option value="重庆">重庆</option>
                        <option value="天津">天津</option>
                        <option value="苏州">苏州</option>
                        <option value="郑州">郑州</option>
                        <option value="长沙">长沙</option>
                        <option value="沈阳">沈阳</option>
                        <option value="青岛">青岛</option>
                        <option value="济南">济南</option>
                        <option value="大连">大连</option>
                        <option value="东莞">东莞</option>
                        <option value="厦门">厦门</option>
                        <option value="福州">福州</option>
                        <option value="昆明">昆明</option>
                        <option value="贵阳">贵阳</option>
                        <option value="哈尔滨">哈尔滨</option>
                        <option value="长春">长春</option>
                        <option value="石家庄">石家庄</option>
                        <option value="太原">太原</option>
                        <option value="南昌">南昌</option>
                        <option value="合肥">合肥</option>
                        <option value="兰州">兰州</option>
                        <option value="乌鲁木齐">乌鲁木齐</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="calculate()">开始排盘</button>
        </div>

        <!-- 错误提示 -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- 加载中 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: var(--text-muted);">正在分析...</p>
        </div>

        <!-- 结果展示 -->
        <div class="result-section" id="resultSection">
            <div class="result-card">
                <div class="result-header">
                    <div>
                        <div class="result-name" id="resultName">张三</div>
                        <div class="result-meta" id="resultMeta">1991年2月14日 辰时 · 女</div>
                    </div>
                    <button class="btn-reset" onclick="resetForm()">重新测算</button>
                </div>

                <!-- 四柱 -->
                <div class="bazi-grid" id="baziGrid"></div>

                <!-- 基础信息 -->
                <div class="info-grid" id="infoGrid"></div>

                <!-- 喜忌神 -->
                <div class="gods-section" id="godsSection"></div>
            </div>

            <!-- 大运 -->
            <div class="result-card dayun-section">
                <div class="dayun-title">大运（每步10年）</div>
                <div class="dayun-grid" id="dayunGrid"></div>
            </div>

            <!-- 流年 -->
            <div class="result-card">
                <div class="dayun-title">近三年流年</div>
                <div class="liunian-list" id="liunianList"></div>
            </div>
        </div>
    </div>

    <script>
        // 五行映射
        const ELEMENT_MAP = {
            "甲": "wood", "乙": "wood",
            "丙": "fire", "丁": "fire",
            "戊": "earth", "己": "earth",
            "庚": "metal", "辛": "metal",
            "壬": "water", "癸": "water",
            "子": "water", "丑": "earth",
            "寅": "wood", "卯": "wood",
            "辰": "earth", "巳": "fire",
            "午": "fire", "未": "earth",
            "申": "metal", "酉": "metal",
            "戌": "earth", "亥": "water"
        };

        const WU_XING_CN = {
            "wood": "木",
            "fire": "火",
            "earth": "土",
            "metal": "金",
            "water": "水"
        };

        const GAN = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
        const ZHI = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
        const SHICHEN = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

        function getWuXing(char) {
            return ELEMENT_MAP[char] || "earth";
        }

        function calculate() {
            const name = document.getElementById("name").value || "访客";
            const gender = document.getElementById("gender").value;
            const year = document.getElementById("year").value;
            const month = document.getElementById("month").value;
            const day = document.getById("day").value;
            const hour = document.getElementById("hour").value;
            const city = document.getElementById("city").value;

            // 验证
            if (!year || !month || !day || !hour) {
                showError("请填写完整的出生信息");
                return;
            }

            hideError();
            showLoading(true);

            fetch("/api/bazi", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name, gender, year, month, day, hour, city})
            })
            .then(r => r.json())
            .then(data => {
                showLoading(false);
                if (data.error) {
                    showError(data.error);
                    return;
                }
                displayResult(data);
            })
            .catch(err => {
                showLoading(false);
                showError("网络错误，请稍后重试");
                console.error(err);
            });
        }

        function displayResult(data) {
            const bazi = data.bazi_data.lunar;
            const ganzhi = bazi.gan_zhi;
            
            // 四柱
            const pillars = [
                { label: "年柱", value: ganzhi.year, pillar: "year" },
                { label: "月柱", value: ganzhi.month, pillar: "month" },
                { label: "日柱", value: ganzhi.day, pillar: "day" },
                { label: "时柱", value: ganzhi.hour, pillar: "hour" }
            ];

            let baziHtml = "";
            pillars.forEach(p => {
                const gan = p.value.charAt(0);
                const zhi = p.value.charAt(1);
                const wuXing = getWuXing(gan);
                baziHtml += `
                    <div class="bazi-column">
                        <div class="bazi-label">${p.label}</div>
                        <div class="bazi-ganzhi">${gan}</div>
                        <div class="bazi-ganzhi">${zhi}</div>
                        <div class="bazi-element">
                            <span class="wu-xing ${wuXing}">${WU_XING_CN[wuXing]}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById("baziGrid").innerHTML = baziHtml;

            // 基础信息
            const birthStr = `${data.birth_info.year}年${data.birth_info.month}月${data.birth_info.day}日 ${bazi.date.shichen}时`;
            document.getElementById("resultName").textContent = data.name;
            document.getElementById("resultMeta").textContent = `${birthStr} · ${data.gender}`;

            const dayGan = ganzhi.day.charAt(0);
            const dayZhi = ganzhi.day.charAt(1);
            const dayWuXing = getWuXing(dayGan);

            let infoHtml = `
                <div class="info-item">
                    <div class="info-label">日主</div>
                    <div class="info-value">${dayGan}木</div>
                </div>
                <div class="info-item">
                    <div class="info-label">真太阳时</div>
                    <div class="info-value gold">${bazi.date.shichen}时</div>
                </div>
                <div class="info-item">
                    <div class="info-label">起运年龄</div>
                    <div class="info-value">${data.bazi_data.dayun.start_age_description}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">大运方向</div>
                    <div class="info-value">${data.bazi_data.dayun.direction}</div>
                </div>
            `;
            document.getElementById("infoGrid").innerHTML = infoHtml;

            // 喜忌神（简化版）
            const goods = ["金", "火", "土"];
            const bads = ["木", "水"];
            
            let godsHtml = `
                <div class="gods-title">喜用神</div>
                <div class="gods-tags">
                    ${goods.map(g => `<span class="god-tag good">${g}</span>`).join("")}
                </div>
                <div class="gods-title" style="margin-top: 16px;">忌神</div>
                <div class="gods-tags">
                    ${bads.map(g => `<span class="god-tag bad">${g}</span>`).join("")}
                </div>
            `;
            document.getElementById("godsSection").innerHTML = godsHtml;

            // 大运
            const dayunList = data.bazi_data.dayun.dayun_list;
            let dayunHtml = "";
            dayunList.forEach(d => {
                const gz = d.gan_zhi;
                const gan = gz.charAt(0);
                const zhi = gz.charAt(1);
                const age = d.age_range;
                dayunHtml += `
                    <div class="dayun-item">
                        <div class="dayun-age">${age}</div>
                        <div class="dayun-gz">${gan} ${zhi}</div>
                    </div>
                `;
            });
            document.getElementById("dayunGrid").innerHTML = dayunHtml;

            // 流年
            const liunian = data.liu_nian || {};
            let liunianHtml = "";
            const years = Object.keys(liunian).sort();
            years.forEach(y => {
                const info = liunian[y];
                liunianHtml += `
                    <div class="liunian-item">
                        <div class="liunian-year">${y}年</div>
                        <div class="liunian-gz">${info.gan_zhi}</div>
                        <div class="liunian-age">虚岁 ${info.age_xu}</div>
                    </div>
                `;
            });
            document.getElementById("liunianList").innerHTML = liunianHtml;

            // 显示结果
            document.getElementById("resultSection").classList.add("show");
            document.getElementById("inputForm").style.display = "none";
        }

        function resetForm() {
            document.getElementById("resultSection").classList.remove("show");
            document.getElementById("inputForm").style.display = "block";
            document.getElementById("errorMsg").classList.remove("show");
        }

        function showError(msg) {
            const el = document.getElementById("errorMsg");
            el.textContent = msg;
            el.classList.add("show");
        }

        function hideError() {
            document.getElementById("errorMsg").classList.remove("show");
        }

        function showLoading(show) {
            document.getElementById("loading").classList.toggle("show", show);
        }
    </script>
</body>
</html>
